<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista Taüll: 3D run preview</title>
<style>
  :root { --ink:#0c121c; --snow:#f4f6f8; --muted:#9fb0c3; --amber:#ffb020; }
  html,body { margin:0; background:var(--ink); color:var(--snow); font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  p.eyebrow { color:var(--amber); font-weight:700; font-size:13px; letter-spacing:.08em; margin:0 0 6px; }
  h1 { font-size: clamp(22px, 4vw, 34px); margin: 0 0 18px; }
  video { width:100%; height:auto; display:block; background:#000; border-radius:4px; }
  p.note { color:var(--muted); font-size:13px; line-height:1.5; margin-top:14px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">ALTITUDE SPATIAL · 3D RUN PREVIEW</p>
  <h1>Vista Taüll to Vista Aran, as guests would see it at the lift</h1>
  <video src="preview-16x9.mp4" autoplay muted loop playsinline controls></video>
  <p class="note">16 s excerpt. 3D render built from terrain survey data. Terrain: ICGC (CC BY 4.0), Copernicus DEM · Map data © OpenStreetMap contributors (ODbL).</p>
</main>
</body>
</html>
